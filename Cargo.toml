[package]
name = "vitral"
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/VictorMenegate/vitral"

# O lançador do Windows (lancador/) é outra crate, só da std. Os dois por padrão: o `cargo test`
# também testa a escolha do lançador, e o `cargo build` do Linux compila o dele, que só avisa.
[workspace]
members = ["lancador"]
default-members = [".", "lancador"]

[dependencies]
anyhow = "1.0.104"
# chrono: a hora das Rotinas no TimeField do kit (que já depende dele).
chrono = "0.4.45"
dirs = "7.0.0"
# dunce: o canonicalize sem o `\\?\C:\…` do Windows (no Linux é o próprio fs::canonicalize).
dunce = "1.0.5"
# syntect: cor de sintaxe no chat, no painel de arquivo e no Revisar (o realce leve; o tree-sitter custa dezenas de MB).
gpui-kit = { version = "0.8.1", features = ["syntect"] }
# minisign-verify: confere a assinatura das versões novas (sem dependências, do autor do minisign).
minisign-verify = "0.3.0"
# Atualização automática: semver compara as versões, sha2 confere o pacote baixado, tar e flate2
# abrem o .tar.gz (sem xattr) e o ureq baixa do GitHub com rustls (sem OpenSSL).
semver = "1.0.28"
sha2 = "0.10.9"
tar = { version = "0.4", default-features = false }
flate2 = "1.1.10"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol = "2.0.2"
tiny_http = "0.12.0"
uuid = { version = "1.29.0", features = ["v4"] }
# zeroize: a chave do Linear some da memória quando sai de uso (já vinha com o oo7).
zeroize = "1"

# oo7: a chave do Linear no chaveiro do sistema (Secret Service). As mesmas features do
# gpui-pre-linux, que já o compila: com outras, o cargo puxaria o tokio.
[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(unix)'.dependencies]
# libc: grupos de processos, sinais e o waitid (src/processos/unix.rs) e o renameat2 e o statvfs do
# atualizador do Linux. Fora do Unix não compila: é o que garante que não sobrou nada dele lá.
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
# windows-sys: Job Objects e threads (src/processos/windows.rs), a Lixeira (src/sistema/windows.rs) e,
# no atualizador, o MoveFileExW, o espaço livre e o relógio desde o boot (src/atualizacao). Já vinha
# no Cargo.lock pelo GPUI.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# embed-resource: o ícone e a versão no vitral.exe (build.rs). Já vinha no Cargo.lock: o GPUI embute
# o manifesto com ele. O `cfg` de uma dependência do build.rs é o do sistema que compila.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Como saem os pacotes dos releases (o GitHub Actions compila assim): sem símbolos e com LTO leve.
[profile.release]
strip = true
lto = "thin"

# Cópia do gpui-component com poucas mudanças, marcadas com "Vitral:": a borda da janela segue o
# tema (a original desenha um contorno cinza fixo; ver vendor/gpui-component/src/window_border.rs),
# os spinners giram num compasso só, a 12 quadros por segundo para todos juntos (src/spinner.rs), o
# realce de sintaxe de um trecho solto é público (src/highlighter), o diff dá o texto de uma linha e
# abre a dobra de uma linha sem rolar (src/diff/document.rs e src/diff/state.rs), o rádio marca com
# uma bolinha (src/radio.rs) e o texto com brilho anda no mesmo compasso (src/shimmer.rs). Menus,
# dicas, avisos, sombras e o Kbd seguem a linguagem visual do Vitral (src/menu, src/tooltip.rs,
# src/notification.rs, src/styled.rs, src/dialog/dialog.rs, src/kbd.rs e src/diff/mod.rs). Do
# polimento: popovers e menus entram com fade e 6 px do lado do gatilho, em 160 ms a no máximo 60
# quadros por segundo (src/popover.rs, `entrada_flutuante`, e src/menu/context_menu.rs); os
# flutuantes têm a linha de luz de 1 px no topo (src/styled.rs); os avisos animam a no máximo 60
# quadros por segundo (src/notification.rs); o compasso dos spinners diz se está batendo, para o
# ponto de "rodando" respirar de carona (src/spinner.rs, `compasso_recente`); e a lista com busca
# tem o rótulo de grupo de 24 com um símbolo antes e a linha sem margem vertical
# (src/command/item.rs, `CommandGroup::label_prefix`, e src/command/state.rs). A barra de rolagem
# aparece e some seca, sem o fade que pedia quadros no ritmo do monitor, e some 1,2 s depois do
# último uso (src/theme/mod.rs, `SCROLLBAR_*`, e `scrollbar_motion` pública para o teste do tema).
# O véu dos diálogos cobre só o quadro da janela, sem a margem da sombra (src/dialog/dialog.rs);
# a dica não reabre com o ponteiro fora da janela (src/tooltip.rs); e, com a janela sem foco, o
# compasso não bate e devolve a fase parada (src/spinner.rs).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
